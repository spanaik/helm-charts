  # EFA-scope metrics, emitted per interface (neuron.efa.<name> with
  # efa_device/efa_port). Names match the sysfs hw_counters filenames. No
  # node rollup: the backend sums across efa_device/efa_port, and an
  # aggregation entry here would replace the per-interface series rather than
  # add to it (see exports.rs as_otel_exports).
