  - { name: err_resource, scope: system, strategy: [sum] }
  - { name: err_resource_nc, scope: system, strategy: [sum] }
  - { name: err_invalid, scope: system, strategy: [sum] }
  - { name: err_unsupported_neff_version, scope: system, strategy: [sum] }
  # `_system` stems keep these node rollups from colliding with the per-core
  # `latency_*_p50`/`_p99` NDS percentile metrics, which sanitize to the same
  # Prometheus name (`.p50` and `_p50` both become `_p50`).
  - { name: latency_device, scope: system, strategy: [avg, p50, p99], aggregated_name: latency_device_system }
  - { name: latency_total, scope: system, strategy: [avg, p50, p99], aggregated_name: latency_total_system }
  - { name: nc_time, scope: system, strategy: [sum] }
  - { name: cc_time, scope: system, strategy: [sum] }
  - { name: time_in_use, scope: system, strategy: [sum, avg, max] }
  - { name: reset_req_count, scope: system, strategy: [sum] }
  - { name: reset_fail_count, scope: system, strategy: [sum] }
  - { name: utilization, scope: system, strategy: [sum, avg, max], aggregated_name: utilization_system }
  - { name: utilization, scope: core, strategy: [sum, avg, max] }
  - { name: effective_flops, scope: system, strategy: [sum] }

  # ── Solstice additions: per-core inf/s, err/s and memory ──────────────────
  # These metrics are already core-scope (see the Core-scope list above); they
  # only reached CloudWatch as node rollups because their sole aggregation entry
  # was scope: system. A scope: core entry emits them per NeuronCore, which also
  # gives awsdevicepodcorrelation a `neuroncore` key to attribute to a pod.
  #
  # `aggregated_name: *_core` goes on the CORE entry, not the system one. Both
  # scopes otherwise sanitize to the same Prometheus name; upstream's convention
  # puts `_system` on the rollup, but doing that here would RENAME the existing
  # neuron_core_infer_completed_sum_total and break current consumers.
  #
  # Memory uses max, not sum: it is a gauge, so summing samples within the
  # collection window would inflate it. Counters keep sum, matching their
  # system entries.
  - { name: infer_completed, scope: core, strategy: [sum], aggregated_name: infer_completed_core }
  - { name: infer_completed_with_err, scope: core, strategy: [sum], aggregated_name: infer_completed_with_err_core }
  - { name: mem_usage_total_device, scope: core, strategy: [max], aggregated_name: mem_usage_total_device_core }

